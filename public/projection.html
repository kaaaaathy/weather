    <script>

        let showAnswer = false;
        let testAnswer = "TESTING";
        let data;
        let rm = RiTa.markov(3);

        let maxN = 49;
        let minN = 25;
        let maxW = -125;
        let minW = -66;

        let nycN = 40.7;
        let nycW = -74.0;

        function randomLatLon(max, min) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        let tomorrow;

        let answers = ``;
        let symbols = [];
        // let images = ["1.jpg", "2.gif", "3.gif", "4.png", "5.png"];
        let url;
        let imageDiv = document.getElementById('nasa');
        let answerDiv = document.getElementById('answer');
        let symbolDiv = document.getElementById('symbol');
        let sky = document.getElementById('sky');



        let symbolTracker = [];

        function makeURL(lat, lon) {
            return "https://weather.ndc.nasa.gov/cgi-bin/get-abi?satellite=GOESEastconusband02&lat=" + lat + "&lon=" + lon + "&zoom=2&type=Animation&numframes=10&width=650&height=450&quality=80g"
        }

        let nycURL = makeURL(nycN, nycW);
        function checkRain(rain) {
            if (rain < 25) {
                symbols.push("A");
                rm.addText("My sources say no, My sources say no, My sources say no, no no no no no no no no no no no");
            } else if (rain >= 25 && rain < 50) {
                symbols.push("B");
                rm.addText("no probably not probably not");
            } else if (rain >= 50 && rain < 75) {
                symbols.push("C");
                rm.addText("it's more than likely, yes yes yes, but not definitely");
            } else {
                symbols.push("D");
                rm.addText("yes yes, it is yes, definitely yes, definitely yes, it is yes, definitely yes");

            }

        }

        function checkWind(wind) {
            if (wind < 3) {
                symbols.push("1");
                rm.addText("in a very long time from now, slowly, ever so slowly, evenly and without hurry");

            } else if (wind >= 3 && wind < 5) {
                symbols.push("2");
                rm.addText("soon but not terribly soon, wait a little bit, not too long, not too soon, soon but not too soon");
            } else if (wind >= 5 && wind < 8) {
                symbols.push("3");
                rm.addText("almost certainly tomorrow, tomorrow it will happen tomorrow. It is tomorrow. It will be tomorrow.")
            } else {
                symbols.push("4");
                rm.addText("My sources say hurriedly, My sources say quickly, immediately, sooner is better than later, rush rush rush, ASAP, as soon as possible, it will be quickly hurriedly");

            }

        }

        // function pickBg() {
        //     return "url('/images/" + images[Math.floor(Math.random() * images.length)] + "')"
        // }

        function checkTemp(temp, div) {
            if (temp < 30) {
                div.classList.add("cold");
            } else if (temp >= 30 && temp < 50) {
                div.classList.add("cool");
            } else if (temp >= 50 && temp < 70) {
                div.classList.add("temperate");
            } else if (temp >= 70 && temp < 85) {
                div.classList.add("warm");
            } else {
                div.classList.add("hot");
            }

        }


        async function getData() {
            try {
                const response = await fetch('https://api.weather.gov/gridpoints/OKX/64,64/forecast');
                data = await response.json();
                tomorrow = data.properties.periods[1];


                temp = tomorrow.temperature;
                checkRain(tomorrow.probabilityOfPrecipitation.value);
                checkWind(tomorrow.windSpeed);
                makeWeatherPanel();

            } catch (error) {
                console.error('Error:', error);
            }
        }
        function markov() {

            sentences = rm.generate();

            if (sentences.length > 0) {
                return sentences;
            } else {
                return "something went wrong"
            }

        }
        async function getText() {
            try {
                const response = await fetch('/src.txt');
                const text = await response.text();

                rm.addText(text);
                console.log(rm);
                console.log(text);
                testAnswer = markov();


            } catch (error) {
                console.error('Error fetching clouds:', error);
            }
        }

        function makeWeatherPanel() {
            if (tomorrow) {
                let weatherDiv = document.getElementById('weather-info');
                let raw = tomorrow.shortForecast.split(".");
                // Extract highest number from windSpeed string
                const windNumbers = tomorrow.windSpeed.match(/\d+(\.\d+)?/g);
                let maxWind = windNumbers ? Math.max(...windNumbers.map(Number)) : '';
                windSpeed = maxWind;
                temp = tomorrow.temperature;
                rain = tomorrow.probabilityOfPrecipitation.value;
                weatherDiv.innerHTML =
                    raw.join(".<br>") + "<br>" +
                    "TEMP: " + temp + " F<br>" +
                    "WIND: " + windSpeed + " mph<br>" +
                    "RAIN: " + rain + "%";



                // I dont think this works...
                checkTemp(temp, answerDiv);
            }
        }

        getData();
        getText();












        // Initialize socket.io
        const socket = io();
        const messages = document.getElementById('messages');
        let questions = [];
        let windSpeed = 1;
        let temp = 0;
        let rain = 0;
        let clock = 0;
        let margin = 20;


        let styles, axis, font;

        // I dont remember what this is about but it has to do with with timing / clock
        let n = -100;

        // Load the font and its variations

        // Remove font/text settings from setup
        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(0);
            angleMode(DEGREES);

        }




        socket.on('chat message', (msg) => {
            questions.push(new Question(msg, floor(random(margin, width - margin)), floor(random(margin, height - margin)), randomVelocity(), randomVelocity(), markov()));
            window.scrollTo(0, document.body.scrollHeight);
        });



        // Remove textFont from draw
        function draw() {
            clock++;
            background(0);
            showAnswer = false;

            // Animate all questions (divs)
            for (let i = 0; i < questions.length; i++) {
                questions[i].animate();

                if (questions[i].isMouseOver()) {
                    giveAnswer(questions[i].answer, questions[i].symbol, questions[i].lat, questions[i].lon);
                    showAnswer = true;
                    // console.log("hovered on " + questions[i].text);
                } else {
                }

                if (clock % 2000 == 0) {
                    questions[i].windy = true;
                    //everynow and then get windy

                    if (n < 14) n += 0.1;
                } else {
                    questions[i].windy = false;
                    if (n > 0) n -= 0.1;
                }
            }


            // if there's no answer being shown and z is pressed, turn it off
            if (!showAnswer) {
                clearAnswer();

            }

            if (keyIsDown(90)) {
                giveAnswer(testAnswer, "A", nycN, nycW);
                showAnswer = true;

            } else {
                showAnswer = false;
            }



            // Weather info as HTML

        }


        function clearAnswer() {
            answerDiv.innerHTML = "";
            symbolDiv.innerHTML = "";
            sky.style.opacity = 0;

            //            if (!imageDiv.classList.contains('hide')) {
            //                imageDiv.classList.add('hide');
            //            }


        }
        function refreshClouds(url) {
            // imageDiv.src = "blank.html";
            imageDiv.src = url;
        }
        function giveAnswer(answer, symbol, lat, lon) {
            answerDiv.innerHTML = answer;
            symbolDiv.innerHTML = symbol;

            let url = refreshClouds(makeURL(lat, lon));
            if (imageDiv.src !== url) {
                sky.style.opacity = 0.25;

            }
            sky.style.opacity = 1;


        }

        // Update Question class to use HTML divs
        class Question {
            constructor(text, x, y, velX, velY, answer) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.velX = velX;
                this.velY = velY;
                this.angle = 0;
                this.windy = false;
                this.life = 0;
                this.div = document.createElement('div');
                this.div.className = 'question';
                this.div.innerText = text;
                this.div.style.left = `${x}px`;
                this.div.style.top = `${y}px`;
                this.answer = answer;
                this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
                this.lat = randomLatLon(maxN, minN);
                this.lon = randomLatLon(maxW, minW);
                // this.bg = images[Math.floor(Math.random() * images.length)];

                // this.div.addEventListener('mouseOver', () => {
                //     giveAnswer(this.answer, this.symbol, this.bg);
                //     console.log("hovered on " + questions[i].text);
                //     console.log("mousing over " + this.text);
                // });

                // this.div.addEventListener('mouseOut', () => {
                //     clearAnswer();
                // });

                document.getElementById('questions-container').appendChild(this.div);


            }



            isMouseOver() {
                const rect = this.div.getBoundingClientRect();
                // Use window event coordinates
                if (
                    mouseX >= rect.left &&
                    mouseX <= rect.right &&
                    mouseY >= rect.top &&
                    mouseY <= rect.bottom
                ) {
                    return true;
                } else {
                    return false;
                }

            }

            animate() {
                this.life++;
                this.decay();

                if (this.windy == true) {
                    this.blowAround();
                } else {
                    this.x += this.velX * Math.cos(this.angle * Math.PI / 180);
                    this.y += this.velY * Math.sin(this.angle * Math.PI / 180);
                }

                if (this.angle >= 360) {
                    this.angle = 0;
                }
                this.angle++;

                // Keep within bounds
                let textWidthPx = this.div.offsetWidth;
                let textHeightPx = this.div.offsetHeight;

                if (this.x >= window.innerWidth - textWidthPx * 0.5 || this.x <= 0 + textWidthPx * 0.5) {
                    this.velX = this.velX * -1;
                }
                if (this.y >= window.innerHeight - textHeightPx * 0.5 || this.y <= 0 + textHeightPx * 0.5) {
                    this.velY = this.velY * -1;
                }

                // Update div position
                this.div.style.left = `${this.x}px`;
                this.div.style.top = `${this.y}px`;
                this.div.style.opacity = (this.opacity / 255).toString();
                console.log(this.isMouseOver());
            }

            // WRITE IN HTML INSTEAD
            blowAround() {
                // Use CSS animation for a "windy" effect
                this.div.style.animation = '';
                const gust = windSpeed * 20 + 'px';
                if (this.velX < 0) {
                    this.div.style.setProperty('--windX', gust);
                    this.div.style.setProperty('--windY', gust);

                } else if (this.velX > 0) {
                    this.div.style.setProperty('--windX', -gust);
                    this.div.style.setProperty('--windY', gust * 0.5);


                }

                this.div.style.animation = 'blow 3s ease-in-out 1';
                setTimeout(() => {
                    this.div.style.animation = '';
                }, 3000);


            }

            checkCollision(other) {
                let d = dist(this.x, this.y, other.x, other.y);
                if (d < textWidth(this.text) * 0.5 + textWidth(other.text) * 0.5) {
                    this.velX *= -1;
                    other.velX *= -1;
                    this.velY *= -1;
                    other.velY *= -1;

                    console.log("Collision detected between: " + this.text + " and " + other.text);
                }

            }

            decay() {
                if (this.life > 100000) {
                    this.style.opacity -= 0.5;
                }
            }

        }

        function randomVelocity() {
            let randomV = random(-0.5, 0.5);
            if (randomV != 0) {
                return randomV;
            } else {
                return randomVelocity();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            // Optionally reposition divs if needed
        }

        document.getElementById('download-btn').addEventListener('click', () => {
            // Extract text from each Question object
            const questionTexts = questions.map(q => q.text);
            const blob = new Blob([questionTexts.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'questions.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
