<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>INTO UNCERTAIN WEATHERS</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="stylesheets/main.css">
    <script src="https://cdn.jsdelivr.net/npm/rita"></script>
</head>

<body>
    <button id="download-btn" style="z-index:1000" type="button">Download Questions</button>
    <button id="tomorrow" style="z-index:1000" type="button">TOMORROW</button>

    <button id="next-day" style="z-index:1000" type="button">DAY AFTER</button>

    <div id="weather-info"></div>
    <div id="questions-container"></div>
    <div id="outline">
        <div id="sky" class="hide">
            <div id="answer-panel" class="hide">

                <div id="symbol"></div>
                <div id="answer"></div>

            </div>
            <iframe id="nasa" src="blank.html">

            </iframe>
        </div>
    </div>
    <a href="/index.html" onclick="window.open(this.href, 'ASK A QUESTION',
'left=800,top=20,width=400,height=500,toolbar=0,resizable=0'); return false;" id="ask">Ask a Question</a>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let nextDay = document.getElementById("next-day");

        let tomorrow = document.getElementById("tomorrow");

        let weathers = {
            'start': `The $adj $noun is $modifier`,
            'noun': `cumulus, cirrus, stratocumulus, fog, patches of $noun, swell, seas, wave, depression, droplets, feathers, barbs, intensification, shift, frontogenesis, squall line, ridge, Spray, Boundary, Convergence, Zone, KNOTS, LOVE, sun, moon, MILLIBARS, tufts, wishing, wanting, Veil of $noun, towers of $noun`.toLowerCase().split(", ").join(" | "),
            'modifier': `at a distance, heard, but no $noun, within the past hour, during the past hour, at the time of observation, which the $noun or $noun may be faintly visible through ground glass, sufficiently dense to hide the $noun or $noun, on land, in a chaotic sky, in the form of $adj towers or battlements, covering $noun, exceeding horizon, alone, accompanied by $noun, combined with $noun, becoming thicker during the past hour.`.toLowerCase().split(", ").join(" | "),
            'adj': `freezing, anvil-shaped, occluded, super, front, coastal, combined, primary, extratropical, DECREASING, CALM, cold, warm, DISSAPATING, Weakening, Rapidly Intensifying, Intertropical, Freezing, Moving, Outflow 
Moderate, Slight, Quasi-Stationary, Continuous, Intermittent, Near Stationary, steady, unsteady, well developed, heavy, less developed, discernable`.toLowerCase().split(", ").join(" | ")
        }



        let rg = RiTa.grammar(weathers);
        let result = rg.expand();
        console.log(result);



        function weatherAnswer() {
            rg = RiTa.grammar(weathers);
            return rg.expand();
        }
        let data;
        let day = 1;


        // FIGURE OUT WHAT DAY IT is
        let now = new Date(Date.now());
        const dowCurrent = now.getDay();
        nextDay.innerText = "NEXT " + returnDow(dowCurrent);

        function returnDow(day) {
            const dowref = {
                0: "Sunday",
                1: "Monday",
                2: "Tuesday",
                3: "Wednesday",
                4: "Thursday",
                5: "Friday",
                6: "Saturday",
            }

            let nextdow;
            if (day + 2 >= 7) {
                nextdow = (day + 2) % 7;
            }
            else {
                nextdow = day + 2;
            }

            return dowref[nextdow];
        }

        let maxN = 49;
        let minN = 25;
        let maxW = -125;
        let minW = -66;

        let nycN = 40.7;
        let nycW = -74.0;

        function randomLatLon(max, min) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        let forecast;

        let answers = ``;
        let symbols = [];
        let url;
        let iframe = document.getElementById('nasa');
        let answerDiv = document.getElementById('answer');
        let symbolDiv = document.getElementById('symbol');
        let sky = document.getElementById('sky');
        let answerPanel = document.getElementById('answer-panel')



        let symbolTracker = [];

        function makeURL(lat, lon) {
            return "/proxy/cgi-bin/get-abi?satellite=GOESEastconusband02&lat=" + lat + "&lon=" + lon + "&zoom=2&type=Animation&numframes=10&width=650&height=450&quality=80g"
        }

        function addModifier(phrase) {
            weathers.modifier += "|" + phrase;


        }
        function addNoun(phrase) {
            weathers.noun += "|" + phrase;


        }

        function newDay(day) {
            if (data) {
                forecast = data.properties.periods[day]
                console.log(forecast);
                temp = forecast.temperature;
                makeWeatherPanel();

                resetSymbols;
                checkRain(forecast.probabilityOfPrecipitation.value);
                checkWind(forecast.windSpeed);
                questions.forEach(q => {
                    q.answer = weatherAnswer();
                    let randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                    q.symbol = randomSym;

                    console.log(q.answer)
                })
            }
        }


        let nycURL = makeURL(nycN, nycW);
        function checkRain(rain) {
            if (rain < 25) {
                symbols.push("A");
                addModifier("absolutely no");
            } else if (rain >= 25 && rain < 50) {
                symbols.push("B");
                addModifier("probably no");
            } else if (rain >= 50 && rain < 75) {
                symbols.push("C");
                addModifier("more than likely");
            } else {
                symbols.push("D");
                addModifier("most certainly");

            }

        }

        function resetSymbols() {
            symbols = [];
        }

        function checkWind(wind) {

            if (wind < 3) {
                symbols.push("1");
                addModifier("evenly and without hurry");

            } else if (wind >= 3 && wind < 5) {
                symbols.push("2");
                addModifier("not terribly soon");

            } else if (wind >= 5 && wind < 8) {
                symbols.push("3");
                addModifier("almost certainly forecast");
            } else {
                symbols.push("4");
                addModifier("immediately");
                addModifier("quickly");

            }

        }


        function checkTemp(temp, div) {
            if (temp < 30) {
                div.classList.add("cold");
            } else if (temp >= 30 && temp < 50) {
                div.classList.add("cool");
            } else if (temp >= 50 && temp < 70) {
                div.classList.add("temperate");
            } else if (temp >= 70 && temp < 85) {
                div.classList.add("warm");
            } else {
                div.classList.add("hot");
            }

        }


        async function getData() {
            try {
                const response = await fetch('https://api.weather.gov/gridpoints/OKX/64,64/forecast');
                data = await response.json();
                newDay(day);
                nextDay.addEventListener('click', () => {

                    if (day < 6) {
                        day++;
                    } else {
                        day = 1;
                    }
                    newDay(day);
                    nextDay.innerText = "NEXT " + returnDow(dowCurrent + day);


                })
                tomorrow.addEventListener('click', () => {

                    day = 1;

                    newDay(day);
                })

            } catch (error) {
                console.error('Error:', error);
            }
        }

        function makeWeatherPanel() {
            if (forecast) {
                let weatherDiv = document.getElementById('weather-info');
                let raw = forecast.shortForecast.split(".");
                // Extract highest number from windSpeed string
                const windNumbers = forecast.windSpeed.match(/\d+(\.\d+)?/g);
                let maxWind = windNumbers ? Math.max(...windNumbers.map(Number)) : '';
                windSpeed = maxWind;
                temp = forecast.temperature;
                rain = forecast.probabilityOfPrecipitation.value;
                weatherDiv.innerHTML =
                    raw.join(".<br>") + "<br>" +
                    "TEMP: " + temp + " F<br>" +
                    "WIND: " + windSpeed + " mph<br>" +
                    "RAIN: " + rain + "%";

            }
        }

        getData();








        // Initialize socket.io
        const socket = io();
        const messages = document.getElementById('messages');
        let questions = [];
        let windSpeed = 1;
        let temp = 0;
        let rain = 0;
        let margin = 50;






        socket.on('chat message', ([msg, xRand, yRand]) => {
            const xPos = Math.floor(xRand * (window.innerWidth - 3 * margin) + margin);
            const yPos = Math.floor(yRand * (window.innerHeight - 2 * margin) + margin);
            let randomSym = symbols[Math.floor(Math.random() * symbols.length)];
            questions.push(new Question(xRand, msg, xPos, yPos, randomVelocity(), randomVelocity(), weatherAnswer(), randomSym, randomLatLon(maxN, minN), randomLatLon(maxW, minW)));

            // console.log(questions);
            window.scrollTo(0, document.body.scrollHeight);
            // saveQuestions();

        });


        socket.on('drag', ({ id, x, y }) => {
            let dragged = questions.find(q => q.id == id);
            if (dragged) {
                dragged.x = x * window.innerWidth;
                dragged.y = y * window.innerHeight;
            }
        })

        let lastDraw = Date.now();
        let fps = 30;
        let lifespan = 25;

        // Remove textFont from draw
        function draw() {
            let elapsed = Date.now() - lastDraw;
            // Animate all questions (divs)
            for (let j = 0; j < Math.min(elapsed / (1000 / fps), 3); j++) {
                for (let i = 0; i < questions.length; i++) {
                    questions[i].animate();

                }
                questions = questions.filter((q) => {
                    if (q.life <= lifespan * 60) {

                        return true;

                    } else {
                        document.getElementById('questions-container').removeChild(q.div);
                        return false;
                    }
                }
                );
                lastDraw = Date.now();
            }


            window.requestAnimationFrame(draw);


        }

        draw();

        window.addEventListener("keydown", (event) => {
            if (event.key == "z" && !event.repeat) {
                giveAnswer(weatherAnswer(), "A", nycN, nycW);

            }
            if (event.key === "x" && !event.repeat) {
                document.getElementById('download-btn').style.opacity = 0.5;
            }
        });

        window.addEventListener("keyup", (event) => {
            if (event.key == "z") {
                clearAnswer();


            }
            if (event.key === "x") {
                document.getElementById('download-btn').style.opacity = 0;
            }
        });

        function clearAnswer() {
            sky.classList.add("hide");
            answerPanel.classList.add("hide");







        }
        function refreshClouds(url) {
            iframe.src = url;
        }
        function giveAnswer(answer, symbol, lat, lon) {


            url = refreshClouds(makeURL(lat, lon));
            answerDiv.innerHTML = answer;
            symbolDiv.innerHTML = symbol;

            if (answerPanel.classList.contains("hide")) {
                answerPanel.classList.remove("hide");
            }

            if (sky.classList.contains("hide")) {
                sky.classList.remove("hide");
            }









        }

        // Update Question class to use HTML divs

        class Question {
            constructor(id, text, x, y, velX, velY, answer, symbol, lat, lon) {
                this.id = id;
                this.text = text;
                this.x = x;
                this.y = y;
                this.velX = velX;
                this.velY = velY;
                this.angle = 0;
                this.life = 0;
                this.div = document.createElement('div');
                this.div.className = 'question';
                this.div.innerText = text;
                this.div.style.left = `${x}px`;
                this.div.style.top = `${y}px`;
                this.answer = answer;
                this.symbol = symbol;
                this.lat = lat;
                this.lon = lon;
                this.dragging = false;


                this.div.addEventListener("mouseenter", () => {
                    giveAnswer(this.answer, this.symbol, this.lat, this.lon);

                });

                this.div.addEventListener("mouseleave", () => {
                    clearAnswer();
                });

                this.dragging = false;

                this.div.addEventListener("mousedown", () => {
                    this.dragging = true;
                });
                window.addEventListener("mouseup", () => {
                    this.dragging = false;
                });
                window.addEventListener("mousemove", (e) => {
                    if (this.dragging) {


                        this.x += e.movementX;
                        this.y += e.movementY;

                        socket.emit('drag', {
                            id: this.id,
                            x: this.x / window.innerWidth,
                            y: this.y / window.innerHeight
                        });
                    }

                });

                let nounCheck = this.text.split(" ");
                nounCheck.forEach(word => {
                    if (RiTa.isNoun(word)) {
                        addNoun(word + "(2)");
                        console.log("added " + word + " to nouns");
                    }
                });

                document.getElementById('questions-container').appendChild(this.div);


            }



            animate() {
                this.life += 1 / fps;
                this.decay();

                if (!this.dragging) {
                    this.x += this.velX * Math.cos(this.angle * Math.PI / 180);
                    this.y += this.velY * Math.sin(this.angle * Math.PI / 180);
                    if (this.angle >= 360) {
                        this.angle = 0;
                    }
                    this.angle++;

                }


                // Keep within bounds
                let textWidthPx = this.div.offsetWidth;
                let textHeightPx = this.div.offsetHeight;

                if (this.x > window.innerWidth - textWidthPx) {
                    this.x -= 5;
                }
                if (this.x < 0) {
                    this.x += 5;
                }
                if (this.y > window.innerHeight - textHeightPx) {
                    this.y -= 5;
                }

                if (this.y < 0) {
                    this.y += 5;
                }



                // Update div position
                this.div.style.left = `${this.x}px`;
                this.div.style.top = `${this.y}px`;
                this.div.style.opacity = (this.opacity / 255).toString();
            }



            decay() {
                if (this.life > lifespan * 60 - 1) {
                    this.div.style.opacity = 0;
                }
            }

        }

        function randomVelocity() {
            let randomV = Math.random() - 0.5;
            if (randomV != 0) {
                return randomV;
            } else {
                return randomVelocity();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            // Optionally reposition divs if needed
        }

        document.getElementById('download-btn').addEventListener('click', () => {
            // Extract text from each Question object
            const questionTexts = questions.map(q => q.text);
            const blob = new Blob([questionTexts.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'questions.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });


    </script>
</body>

</html>
