<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="stylesheets/main.css">
    <script src='https://unpkg.com/opentype.js@1.3.4/dist/opentype.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/addons/p5.sound.min.js"></script>
</head>

<body>
    <button id="download-btn" style="z-index:1000" type="button">Download Questions</button>

    <div id="weather-info"></div>
    <div id="questions-container"></div>
    <div id="sky">
        <iframe src="symbols.html" id="viewport">
        </iframe>

        <div id="rain"></div>
    </div>
    <a href="/index.html" target="_blank" id="ask">Ask a Question</a>
    <script src="/socket.io/socket.io.js"></script>
    <script>

        let tomorrow;

        async function getData() {
            try {
                const response = await fetch('https://api.weather.gov/gridpoints/OKX/64,64/forecast');
                data = await response.json();
                tomorrow = data.properties.periods[1];
                console.log(tomorrow.detailedForecast);
            } catch (error) {
                console.error('Error:', error);
            }
        }
        getData();

        // Initialize socket.io
        const socket = io();
        const messages = document.getElementById('messages');
        let questions = [];
        let windSpeed = 1;
        let temp = 0;
        let rain = 0;
        let clock = 0;
        let margin = 20;


        let styles, axis, font;
        let n = -100;

        // Load the font and its variations

        // Remove font/text settings from setup
        function setup() {
            createCanvas(windowWidth, windowHeight);
            background(0);
            angleMode(DEGREES);

        }


        socket.on('chat message', (msg) => {
            questions.push(new Question(msg, floor(random(margin, width - margin)), floor(random(margin, height - margin)), randomVelocity(), randomVelocity()));

            window.scrollTo(0, document.body.scrollHeight);
        });



        // Remove textFont from draw
        function draw() {
            clock++;
            background(0);

            // Animate all questions (divs)
            for (let i = 0; i < questions.length; i++) {
                questions[i].animate();
                if (clock % 800 == 0) {
                    questions[i].windy = true;
                    if (n < 14) n += 0.1;
                } else {
                    questions[i].windy = false;
                    if (n > 0) n -= 0.1;
                }
            }

            // Weather info as HTML
            if (tomorrow) {
                let weatherDiv = document.getElementById('weather-info');
                let raw = tomorrow.shortForecast.split(".");
                // Extract highest number from windSpeed string
                const windNumbers = tomorrow.windSpeed.match(/\d+(\.\d+)?/g);
                let maxWind = windNumbers ? Math.max(...windNumbers.map(Number)) : '';
                windSpeed = maxWind;
                temp = tomorrow.temperature;
                rain = tomorrow.probabilityOfPrecipitation.value;
                weatherDiv.innerHTML =
                    raw.join(".<br>") + "<br>" +
                    "TEMP: " + temp + " F<br>" +
                    "WIND: " + windSpeed + " mph<br>" +
                    "RAIN: " + rain + "%";
            }
        }




        // Update Question class to use HTML divs
        class Question {
            constructor(text, x, y, velX, velY) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.velX = velX;
                this.velY = velY;
                this.angle = 0;
                this.windy = false;
                this.life = 0;
                this.div = document.createElement('div');
                this.div.className = 'question';
                this.div.innerText = text;
                this.div.style.left = `${x}px`;
                this.div.style.top = `${y}px`;
                document.getElementById('questions-container').appendChild(this.div);
            }

            animate() {
                this.life++;
                this.decay();

                if (this.windy == true) {
                    this.blowAround();
                } else {
                    this.x += this.velX * Math.cos(this.angle * Math.PI / 180);
                    this.y += this.velY * Math.sin(this.angle * Math.PI / 180);
                }

                if (this.angle >= 360) this.angle = 0;
                this.angle++;

                // Keep within bounds
                let textWidthPx = this.div.offsetWidth;
                let textHeightPx = this.div.offsetHeight;

                if (this.x >= window.innerWidth - textWidthPx * 0.5 || this.x <= 0 + textWidthPx * 0.5) {
                    this.velX = this.velX * -1;
                }
                if (this.y >= window.innerHeight - textHeightPx * 0.5 || this.y <= 0 + textHeightPx * 0.5) {
                    this.velY = this.velY * -1;
                }

                // Update div position
                this.div.style.left = `${this.x}px`;
                this.div.style.top = `${this.y}px`;
                this.div.style.opacity = (this.opacity / 255).toString();
            }

            // WRITE IN HTML INSTEAD
            blowAround() {
                // Use CSS animation for a "windy" effect
                this.div.style.animation = '';
                const gust = windSpeed * 20 + 'px';
                if (this.velX < 0) {
                    this.div.style.setProperty('--windX', gust);
                    this.div.style.setProperty('--windY', gust * 0.5);

                } else if (this.velX > 0) {
                    this.div.style.setProperty('--windX', -gust);
                    this.div.style.setProperty('--windY', gust * 0.5);


                }

                this.div.style.animation = 'blow 3s ease-in-out 1';
                setTimeout(() => {
                    this.div.style.animation = '';
                }, 3000);


            }

            checkCollision(other) {
                let d = dist(this.x, this.y, other.x, other.y);
                if (d < textWidth(this.text) * 0.5 + textWidth(other.text) * 0.5) {
                    this.velX *= -1;
                    other.velX *= -1;
                    this.velY *= -1;
                    other.velY *= -1;

                    console.log("Collision detected between: " + this.text + " and " + other.text);
                }

            }

            decay() {
                if (this.life > 100000) {
                    this.style.opacity -= 0.5;
                }
            }

        }

        function randomVelocity() {
            let randomV = random(-0.5, 0.5);
            if (randomV != 0) {
                return randomV;
            } else {
                return randomVelocity();
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            // Optionally reposition divs if needed
        }

        document.getElementById('download-btn').addEventListener('click', () => {
            // Extract text from each Question object
            const questionTexts = questions.map(q => q.text);
            const blob = new Blob([questionTexts.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'questions.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>

</html>
