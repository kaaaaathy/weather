        function addModifier(phrase) {

        function checkRain(rain) {
            if (rain < 25) {
                symbols.push("A");
                addModifier("absolutely no");
            } else if (rain >= 25 && rain < 50) {
                symbols.push("B");
                addModifier("probably no");
            } else if (rain >= 50 && rain < 75) {
                symbols.push("C");
                addModifier("more than likely");
            } else {
                symbols.push("D");
                addModifier("most certainly");

            }

        }

        function checkWind(wind) {
            if (wind < 3) {
                symbols.push("1");
                addModifier("evenly and without hurry");

            } else if (wind >= 3 && wind < 5) {
                symbols.push("2");
                addModifier("not terribly soon");

            } else if (wind >= 5 && wind < 8) {
                symbols.push("3");
                addModifier("almost certainly tomorrow");
            } else {
                symbols.push("4");
                addModifier("immediately");
                addModifier("quickly");

            }

        }


        function checkTemp(temp, div) {
            if (temp < 30) {
                div.classList.add("cold");
            } else if (temp >= 30 && temp < 50) {
                div.classList.add("cool");
            } else if (temp >= 50 && temp < 70) {
                div.classList.add("temperate");
            } else if (temp >= 70 && temp < 85) {
                div.classList.add("warm");
            } else {
                div.classList.add("hot");
            }

        let lastDraw = Date.now();

        // Remove textFont from draw
        function draw() {
            let elapsed = Date.now() - lastDraw;
            // Animate all questions (divs)
            for (let j = 0; j < Math.min(elapsed / (1000 / fps), 3); j++) {
                for (let i = 0; i < questions.length; i++) {
                    questions[i].animate();

                }
                questions = questions.filter((q) => {
                    if (q.life <= lifespan * 60) {

                        return true;

                    } else {
                        document.getElementById('questions-container').removeChild(q.div);
                        return false;
                    }
                }
                );
                lastDraw = Date.now();
            }


            window.requestAnimationFrame(draw);

        }

        // Update Question class to use HTML divs
        // THERES 3 THINGS WE NEED FOR DRAGGING TO WORK!

        class Question {
            constructor(id, text, x, y, velX, velY, answer, symbol, lat, lon) {
                this.id = id;
                this.text = text;
                this.x = x;
                this.y = y;
                this.velX = velX;
                this.velY = velY;
                this.angle = 0;
                this.life = 0;
                this.div = document.createElement('div');
                this.div.className = 'question';
                this.div.innerText = text;
                this.div.style.left = `${x}px`;
                this.div.style.top = `${y}px`;
                this.answer = answer;
                this.symbol = symbol;
                this.lat = lat;
                this.lon = lon;
                this.dragging = false;

                // this.div.setAttribute("can-move", true);
                // this.div.id = text.replace(/ /g, '-') + "-play";
                // playhtml.setupPlayElement(this.div);
                this.div.addEventListener("mouseenter", () => {
                    giveAnswer(this.answer, this.symbol, this.lat, this.lon);

                });

                this.div.addEventListener("mouseleave", () => {
                    clearAnswer();
                });

                this.dragging = false;

                this.div.addEventListener("mousedown", () => {
                    this.dragging = true;
                });
                window.addEventListener("mouseup", () => {
                    this.dragging = false;
                });
                window.addEventListener("mousemove", (e) => {
                    if (this.dragging) {


                        this.x += e.movementX;
                        this.y += e.movementY;

                        socket.emit('drag', {
                            id: this.id,
                            x: this.x / window.innerWidth,
                            y: this.y / window.innerHeight
                        });
                    }

                });

                let nounCheck = this.text.split(" ");
                nounCheck.forEach(word => {
                    if (RiTa.isNoun(word)) {
                        addNoun(word + "(2)");
                        console.log("added " + word + " to nouns");
                    }
                });

                document.getElementById('questions-container').appendChild(this.div);


            }



            animate() {
                this.life += 1 / fps;
                this.decay();

                if (!this.dragging) {
                    this.x += this.velX * Math.cos(this.angle * Math.PI / 180);
                    this.y += this.velY * Math.sin(this.angle * Math.PI / 180);
                    if (this.angle >= 360) {
                        this.angle = 0;
                    }
                    this.angle++;

                }


                // Keep within bounds
                let textWidthPx = this.div.offsetWidth;
                let textHeightPx = this.div.offsetHeight;

                if (this.x > window.innerWidth - textWidthPx) {
                    this.x -= 5;
                }
                if (this.x < 0) {
                    this.x += 5;
                }
                if (this.y > window.innerHeight - textHeightPx) {
                    this.y -= 5;
                }

                if (this.y < 0) {
                    this.y += 5;
                }

                // if (this.x >= window.innerWidth - textWidthPx * 0.5 || this.x <= 0 + textWidthPx * 0.5) {
                //     this.velX = this.velX * -1;
                // }
                // if (this.y >= window.innerHeight - textHeightPx * 0.5 || this.y <= 0 + textHeightPx * 0.5) {
                //     this.velY = this.velY * -1;
                // }

                // Update div position
                this.div.style.left = `${this.x}px`;
                this.div.style.top = `${this.y}px`;
                this.div.style.opacity = (this.opacity / 255).toString();
            }



            decay() {
                if (this.life > lifespan * 60 - 1) {
                    this.div.style.opacity = 0;
                }
            }

        }

        function randomVelocity() {
            let randomV = Math.random() - 0.5;
            if (randomV != 0) {
                return randomV;
            } else {
                return randomVelocity();
            }
        }

            a.download = 'questions.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
