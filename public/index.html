<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>FUN PROJECT W SIB</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="stylesheets/main.css">

</head>

<body>
    <p id="instruction">Ask a question</p>

    <form id="form">
        <input id="input" autocomplete="off" /><button id="submit">Send</button>
    </form>


    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const bannedWords = ["nigg", "fag", "cunt"]; // Add more as needed

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const value = input.value.trim().toLowerCase();
            if (value && !bannedWords.some(word => value.includes(word))) {
                socket.emit('chat message', input.value);
                input.value = '';
            } else if (bannedWords.some(word => value.includes(word))) {
                alert("Your message contains a word that kathy decided to censor, sorry!");
            }
        });
    </script>
</body>

</html>
