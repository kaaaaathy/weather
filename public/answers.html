<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="stylesheets/main.css">
    <script src="https://cdn.jsdelivr.net/npm/rita"></script>
</head>


<body>

    <div id="image">
        <div id="symbol"></div>
        <div id="answer"></div>
    </div>

</body>

<script>


    let sentences = "";
    let poem;

    let data;
    let rm;
    let tomorrow;
    let eightball = `
It is certain
It is decidedly so
Without a doubt
Yes definitely
You may rely on it
As I see it, yes
Most likely
Outlook good
Yes
Signs point to yes
Reply hazy, try again
Ask again later
Better not tell you now
Cannot predict now
Concentrate and ask again
Don't count on it
My reply is no
My sources say no
Outlook not so good
Very doubtful
`;
    let answers = ``;
    let symbols = [];
    let images = ["1.jpg", "2.gif", "3.gif", "4.png", "5.png"];

    let imageDiv = document.getElementById('image');
    let answerDiv = document.getElementById('answer');
    let symbolDiv = document.getElementById('symbol');



    let symbolTracker = [];

    function checkRain(rain) {
        if (rain < 25) {
            symbols.push("A");
        } else if (rain >= 25 && rain < 50) {
            symbols.push("B");
        } else if (rain >= 50 && rain < 75) {
            symbols.push("C");
        } else {
            symbols.push("D");
        }
        imageDiv.style.backgroundImage = "url('/images/" + images[Math.floor(Math.random() * images.length)] + "')";

    }

    function checkWind(wind) {
        if (wind < 3) {
            symbols.push("1");
        } else if (wind >= 3 && wind < 5) {
            symbols.push("2");
        } else if (wind >= 5 && wind < 8) {
            symbols.push("3");
        } else {
            symbols.push("4");
        }

    }

    function checkTemp(temp, div) {
        if (temp < 30) {
            div.classList.add("cold");
        } else if (temp >= 30 && temp < 50) {
            div.classList.add("cool");
        } else if (temp >= 50 && temp < 70) {
            div.classList.add("temperate");
        } else if (temp >= 70 && temp < 85) {
            div.classList.add("warm");
        } else {
            div.classList.add("hot");
        }

    }

    async function getPoem() {
        try {
            const response = await fetch('src.txt');
            const txt = await response.text();
            return (txt);


        } catch (error) {
            console.error('Error fetching src.txt:', error);
            return '';
        }
    }

    async function getData() {
        try {
            const response = await fetch('https://api.weather.gov/gridpoints/OKX/64,64/forecast');
            data = await response.json();

            tomorrow = data.properties.periods[1];
            checkRain(tomorrow.probabilityOfPrecipitation.value);
            checkWind(tomorrow.windSpeed);
            temp = tomorrow.temperature;
            // getPoem();
            rm = RiTa.markov(3);
            rm.addText(eightball);
            // console.log(getPoem());
            sentences = rm.generate();


            makeBody(sentences);






        } catch (error) {
            console.error('Error:', error);
        }
    }




    function makeBody(input) {

        answerDiv.innerHTML = input;
        symbolDiv.innerHTML = symbols.join(" ");

        checkTemp(temp, answerDiv);

    }


    getData();



</script>


</html>
