    let foo; // speech synthesis object

    function setup() {

        foo = new p5.Speech();
        caption.innerHTML = instruction;



    }



    function keyPressed() {

        let checkChar = match(key, '[a-zA-Z0-9]');
        if (checkChar && key.length <= 1) {
            socket.emit('key input', key);
        }
        handleKeyInput(key);

    }


    function handleKeyInput(key) {
        voices = speaker.getVoices();


        let checkChar = match(key, '[a-zA-Z0-9]');
        if (checkChar && key.length <= 1) {


            glyph.innerHTML = key;
            glyph.style.height = window.innerWidth;
            glyph.style.fontSize = window.innerWidth * 0.6;

            caption.innerHTML = alphakey[key];

            let utterance = new SpeechSynthesisUtterance(alphakey[key]);
            utterance.rate = 0.6;
            utterance.lang = "en-GB";
            utterance.voice = voices[32];
            speechSynthesis.speak(utterance);

        }

        else {
            caption.innerHTML = instruction;

            glyph.innerHTML = "";


        }
    }
