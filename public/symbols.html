    let poem;
    let contents;
    let symbols = [" ", "w", "x", " ", " "];
    let symbolTracker = [];
    let divTracker = [];

    function checkRain(rain) {
        if (rain < 25) {
            symbols.push("A");
        } else if (rain >= 25 && rain < 50) {
            symbols.push("B");
        } else if (rain >= 50 && rain < 75) {
            symbols.push("C");
        } else {
            symbols.push("D");
        }

    }

    function checkWind(wind) {
        if (wind < 3) {
            symbols.push("1");
        } else if (wind >= 3 && wind < 5) {
            symbols.push("2");
        } else if (wind >= 5 && wind < 8) {
            symbols.push("3");
        } else {
            symbols.push("4");
        }

    }

    function checkTemp(temp, div) {
        if (temp < 30) {
            div.classList.add("cold");
        } else if (temp >= 30 && temp < 50) {
            div.classList.add("cool");
        } else if (temp >= 50 && temp < 70) {
            div.classList.add("temperate");
        } else if (temp >= 70 && temp < 85) {
            div.classList.add("warm");
        } else {
            div.classList.add("hot");
        }

    }


    async function getData() {
        try {
            const response = await fetch('https://api.weather.gov/gridpoints/OKX/64,64/forecast');
            data = await response.json();
            tomorrow = data.properties.periods[1];
            poem = "What's the weather like, " + tomorrow.detailedForecast + " " + raw;
            poem = poem.split(' ');
            checkRain(tomorrow.probabilityOfPrecipitation.value);
            checkWind(tomorrow.windSpeed);
            temp = tomorrow.temperature;

            makeBody(poem);



        } catch (error) {
            console.error('Error:', error);
        }
    }

                    input[i] = symbols[Math.floor(Math.random() * symbols.length)];
                    symbolTracker.push(i);
                    if (symbolTracker.includes(i) && !divTracker[i].classList.contains('symbol')) {

    function makeBody(input) {
        contents = document.getElementById('cloud-container');

        for (let i = 0; i < input.length; i++) {
            let word = document.createElement('div');
            word.classList.add('word');
            divTracker.push(word);
            contents.appendChild(word);
        }
        checkTemp(temp, contents);
        animate(input);

    }

    async function animate(input) {
        convolute(input);

        await wait(6000);
        animate(input);

    }





    function wait(time) {
        return new Promise(resolve => {
            setTimeout(() => {
                resolve('resolved');
            }, time);
        });
